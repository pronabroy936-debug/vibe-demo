<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b10" />
  <title>VIBE – All-in-one hub</title>
  <link rel="icon" href="assets/icons/favicon.png" type="image/png" />
  <link rel="preload" href="assets/logo/vibe-logo.png" as="image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Always load the newest CSS (a fresh ?v= each visit stops phones showing an old cached copy after an update) -->
  <script>window.__V = Date.now(); document.write('<link rel="stylesheet" href="css/style.css?v=' + window.__V + '" />');</script>
  <noscript><link rel="stylesheet" href="css/style.css" /></noscript>
</head>
<body>
  <div class="stage">
    <div class="device" id="device">
      <!-- Fake status bar (desktop frame only) -->
      <div class="statusbar" aria-hidden="true">
        <span class="sb-time" id="sbTime">11:14</span>
        <span class="sb-icons">
          <svg viewBox="0 0 24 24"><path d="M2 18h3v3H2zm5-4h3v7H7zm5-4h3v11h-3zm5-5h3v16h-3z" fill="currentColor"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 20l3.5-4.2a5 5 0 0 0-7 0zM12 4C7.6 4 3.6 5.7.6 8.5L3 11.3a13 13 0 0 1 18 0l2.4-2.8C20.4 5.7 16.4 4 12 4zm0 5.3a8 8 0 0 0-6.2 2.8l2.4 2.8a5 5 0 0 1 7.6 0l2.4-2.8A8 8 0 0 0 12 9.3z" fill="currentColor"/></svg>
          <span class="sb-batt"><i></i></span>
        </span>
      </div>

      <!-- All screens are rendered into this container by js/app.js -->
      <main class="screens" id="screens" aria-live="polite"></main>

      <!-- Toasts -->
      <div class="toast-wrap" id="toastWrap" aria-live="assertive"></div>

      <!-- Modal / bottom sheet -->
      <div class="sheet-backdrop" id="sheetBackdrop" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      </div>

      <!-- Opening animation (VIBE intro video). Tap "Skip" or wait for it to finish. -->
      <div class="splash" id="splash">
        <video class="splash-bg" id="splashBg" src="assets/video/vibe-intro.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
        <video class="splash-video" id="splashVideo" src="assets/video/vibe-intro.mp4" muted playsinline preload="auto"></video>
        <img class="splash-fallback" id="splashFallback" src="assets/logo/vibe-logo.png" alt="VIBE – All-in-one hub" hidden />
        <button class="splash-skip" id="splashSkip">Skip <span aria-hidden="true">›</span></button>
        <button class="splash-sound" id="splashSound" aria-label="Turn sound on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h4l5-4v13l-5-4H4z"/><path class="sound-on" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="sound-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
        <div class="splash-progress"><i id="splashBar"></i></div>
      </div>

      <!-- Full-screen loader -->
      <div class="loader" id="loader" hidden>
        <div class="loader-ring"></div>
        <p id="loaderText">Loading…</p>
      </div>
    </div>
  </div>

  <!-- Always load the newest app script (same cache-busting as the CSS above) -->
  <script>document.write('<script src="js/app.js?v=' + window.__V + '"><\/script>');</script>
</body>
</html>
